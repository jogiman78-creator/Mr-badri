<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mr Badri Rewards</title>
<style>
body{font-family:Arial;background:#101827;color:white;text-align:center;padding:15px}
.card{max-width:400px;margin:20px auto;background:#1f2937;padding:20px;border-radius:14px}
input,button{width:100%;box-sizing:border-box;padding:13px;margin:8px 0;border-radius:8px;border:0}
input{background:white;color:#111}
button{background:#16a34a;color:white;font-weight:bold}
button:disabled{background:#777}
#message{overflow-wrap:anywhere}
</style>
</head>
<body>
<div class="card">
<h1>Welcome to Mr Badri</h1>
<p>Refer and earn rewards</p>

<button type="button" onclick="window.open('https://www.7a0f8mi.com/#/?invitationCode=2992000774','_blank')">Open Referral Link</button>

<label>UPI ID</label>
<input id="upi" placeholder="Enter your UPI ID">

<button type="button" id="submitUpiBtn">Submit UPI</button>

<form id="rewardForm">
<label>Game UID</label>
<input name="uid" placeholder="Enter your UID" required>

<label>Upload screenshot</label>
<input type="file" name="screenshot" accept="image/png,image/jpeg,image/webp" required>

<label><input type="checkbox" required style="width:auto"> My UID matches the screenshot</label>

<button id="submitBtn" type="submit">Submit UID and Screenshot</button>
</form>
<p id="message" role="status"></p>
</div>

<script>
const upiInput = document.getElementById('upi');
const upiBtn = document.getElementById('submitUpiBtn');
const form = document.getElementById('rewardForm');
const submitBtn = document.getElementById('submitBtn');
const msg = document.getElementById('message');

upiBtn.addEventListener('click', async () => {
    const upi = upiInput.value.trim();
    if (!upi) {
        msg.textContent = 'Pehle UPI ID bharo.';
        return;
    }

    upiBtn.disabled = true;
    msg.textContent = 'UPI bheji ja rahi hai...';

    try {
        const data = new FormData();
        data.append('upi', upi);

        const response = await fetch('/submit-upi', {
            method: 'POST',
            body: data
        });
        const result = await response.json();
        msg.textContent = result.message || 'Request complete.';

        if (!response.ok || !result.success) {
            upiBtn.disabled = false;
        }
    } catch (error) {
        msg.textContent = 'Connection error. Dobara try karo.';
        upiBtn.disabled = false;
    }
});

form.addEventListener('submit', async (e) => {
    e.preventDefault();
    submitBtn.disabled = true;
    msg.textContent = 'Submitting...';

    const data = new FormData(form);
    data.append('upi', upiInput.value.trim());

    try {
        const response = await fetch('/submit', {method:'POST', body:data});
        const result = await response.json();
        msg.textContent = result.message || 'Request complete.';

        if (!response.ok || !result.success) {
            submitBtn.disabled = false;
        }
    } catch (error) {
        msg.textContent = 'Connection error. Dobara try karo.';
        submitBtn.disabled = false;
    }
});
</script>
</body>
</html>
